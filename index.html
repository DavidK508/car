<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Кабина — 3D гонка</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: "Segoe UI", system-ui, sans-serif; }
    #app { width: 100%; height: 100%; }
    .hud {
      position: fixed; left: 0; right: 0; top: 0; bottom: 0;
      pointer-events: none; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.7);
    }
    .speedo {
      position: absolute; right: 28px; bottom: 24px; text-align: right;
    }
    .speedo .val { font-size: 56px; font-weight: 700; line-height: 1; letter-spacing: 1px; }
    .speedo .unit { font-size: 16px; opacity: .75; }
    .score {
      position: absolute; left: 28px; top: 20px; font-size: 20px; font-weight: 600;
    }
    .score .best { display: block; font-size: 13px; font-weight: 400; opacity: .75; margin-top: 4px; }
    .gear {
      position: absolute; right: 32px; bottom: 92px; font-size: 15px; opacity: .8;
    }
    .overlay {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: radial-gradient(ellipse at center, rgba(10,14,24,.55), rgba(4,6,12,.88));
      color: #fff; text-align: center; pointer-events: auto;
      transition: opacity .35s ease;
    }
    .overlay.hidden { opacity: 0; pointer-events: none; }
    .overlay h1 { font-size: 44px; letter-spacing: 2px; font-weight: 800; }
    .overlay h1 span { color: #ffb347; }
    .overlay p { font-size: 16px; opacity: .85; line-height: 1.7; max-width: 460px; }
    .overlay .keys {
      display: grid; grid-template-columns: auto auto; gap: 6px 18px;
      font-size: 15px; margin: 8px 0 4px;
    }
    .overlay .keys b {
      display: inline-block; min-width: 110px; text-align: right; color: #ffd28a;
      font-weight: 600;
    }
    .btn {
      margin-top: 10px; padding: 13px 38px; font-size: 18px; font-weight: 700;
      color: #1a1205; background: linear-gradient(180deg, #ffd28a, #ffb347);
      border: none; border-radius: 10px; cursor: pointer;
      box-shadow: 0 6px 24px rgba(255,179,71,.35);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(255,179,71,.5); }
    .overlay .stats { font-size: 22px; font-weight: 600; margin-top: 6px; }
    .overlay .stats span { color: #ffd28a; }
    .crash-flash {
      position: fixed; inset: 0; background: #ff2a2a; opacity: 0; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="hud">
    <div class="score">
      <div id="dist">0 м</div>
      <div class="best" id="best">Рекорд: 0 м</div>
    </div>
    <div class="gear" id="gear">D</div>
    <div class="speedo">
      <div><span class="val" id="kmh">0</span> <span class="unit">км/ч</span></div>
    </div>
  </div>
  <div class="crash-flash" id="flash"></div>
  <div class="overlay" id="overlay">
    <h1>КАБИНА<span>·</span>ГОНКА</h1>
    <div class="keys">
      <b>W / ↑</b><span>газ</span>
      <b>S / ↓</b><span>тормоз</span>
      <b>A D / ← →</b><span>руль</span>
      <b>R</b><span>заново</span>
    </div>
    <p>Держите полосу, объезжайте машины. Столкновение — конец заезда.</p>
    <button class="btn" id="startBtn">Начать заезд</button>
  </div>

  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
  <script type="module" src="game.js"></script>
</body>
</html>
